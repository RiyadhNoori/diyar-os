if loadfont /boot/grub/font.pf2 ; then
  set gfxmode=auto
  insmod efi_gop
  insmod efi_uga
  insmod gfxterm
  terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/yellow
set timeout=15
set default=0

# ── الخيار الافتراضي: آمن لجميع الأجهزة ──────────────────────────────────
menuentry "تجربة نظام ديار - آمن (موصى به)" --hotkey=1 {
    linux   /live/vmlinuz boot=live components quiet noplymouth noeject nomodeset locales=ar_IQ.UTF-8 keyboard-layouts=ara,us timezone=Asia/Baghdad hostname=diyar-live username=diyar
    initrd  /live/initrd.img
}

menuentry "Try Diyar OS - Safe Mode (Recommended)" --hotkey=2 {
    linux   /live/vmlinuz boot=live components quiet noplymouth noeject nomodeset locales=ar_IQ.UTF-8 keyboard-layouts=ara,us timezone=Asia/Baghdad hostname=diyar-live username=diyar
    initrd  /live/initrd.img
}

# ── كامل الميزات: compositor + splash ─────────────────────────────────────
menuentry "تجربة نظام ديار - كامل الميزات" --hotkey=3 {
    linux   /live/vmlinuz boot=live components splash locales=ar_IQ.UTF-8 keyboard-layouts=ara,us timezone=Asia/Baghdad hostname=diyar-live username=diyar
    initrd  /live/initrd.img
}

menuentry "Try Diyar OS - Full Features" --hotkey=4 {
    linux   /live/vmlinuz boot=live components splash locales=ar_IQ.UTF-8 keyboard-layouts=ara,us timezone=Asia/Baghdad hostname=diyar-live username=diyar
    initrd  /live/initrd.img
}

# ── تنصيب النظام ──────────────────────────────────────────────────────────
menuentry "تنصيب نظام ديار على القرص الصلب" --hotkey=5 {
    linux   /live/vmlinuz boot=live components quiet noplymouth noeject nomodeset locales=ar_IQ.UTF-8 keyboard-layouts=ara,us timezone=Asia/Baghdad hostname=diyar-live username=diyar
    initrd  /live/initrd.img
}

menuentry "Install Diyar OS to Hard Drive" --hotkey=6 {
    linux   /live/vmlinuz boot=live components quiet noplymouth noeject nomodeset locales=ar_IQ.UTF-8 keyboard-layouts=ara,us timezone=Asia/Baghdad hostname=diyar-live username=diyar
    initrd  /live/initrd.img
}

# ── وضع الاسترداد ─────────────────────────────────────────────────────────
menuentry "استرداد النظام - وضع الأمان القصوى" --hotkey=7 {
    linux   /live/vmlinuz boot=live components quiet noplymouth noeject nomodeset acpi=off noapic locales=ar_IQ.UTF-8 keyboard-layouts=ara,us timezone=Asia/Baghdad hostname=diyar-live username=diyar
    initrd  /live/initrd.img
}
